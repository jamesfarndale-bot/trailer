name: IMDb watchlist
on:
  push:
    paths: [imdb-url.txt, tools/**, .github/workflows/imdb.yml]
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: imdb
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/imdb.js 2>&1 | tee run.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Save the list
        run: |
          git config user.name "play.tv bot"
          git config user.email "actions@users.noreply.github.com"
          git add imdb.json
          git diff --cached --quiet || (git commit -m "Update IMDb watchlist" && git push)
      - name: Keep debug output
        if: failure()
        run: |
          git config user.name "play.tv bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B debug
          git add -f debug.png debug.html run.log || true
          git commit -m "Debug output" && git push -f origin debug
