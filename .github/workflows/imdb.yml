name: IMDb watchlist
on:
  push:
    paths: ['**.csv', tools/csv2json.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency: imdb
jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/csv2json.py
      - run: |
          git config user.name "play.tv bot"
          git config user.email "actions@users.noreply.github.com"
          git add imdb.json
          git diff --cached --quiet || (git commit -m "Update IMDb watchlist" && git push)
