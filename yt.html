<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Trailer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
</head><body>
<script>
// Hosts the YouTube player for play.tv on Samsung TVs, which can't embed YouTube from a local app page.
(function () {
  var q = {}; location.search.slice(1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  var id = (q.v || '').replace(/[^\w-]/g, ''); if (!id) return;
  var bg = q.bg === '1';
  var src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&controls=' + (bg ? 0 : 1) + '&mute=' + (bg ? 1 : 0) +
    '&loop=1&playlist=' + id + '&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&disablekb=1&fs=0&enablejsapi=1' + (bg ? '&start=8' : '') +
    '&origin=' + encodeURIComponent(location.origin);
  var f = document.createElement('iframe');
  f.src = src; f.allow = 'autoplay; encrypted-media; fullscreen';
  f.onload = function () { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (e) {} };
  document.body.appendChild(f);
  // Pass the player's state messages up to the app so it knows when the video has started.
  window.addEventListener('message', function (e) { if (e.source === f.contentWindow && window.parent !== window) window.parent.postMessage(e.data, '*'); });
})();
</script>
</body></html>
